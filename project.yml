name: ZaytoonaConnect
options:
  bundleIdPrefix: com.zaytoona
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ZaytoonaConnect:
    type: application
    platform: iOS
    sources:
      - path: ZaytoonaConnect
    resources:
      - path: ZaytoonaConnect/Assets.xcassets
    info:
      path: ZaytoonaConnect/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaytoona.connect
        PRODUCT_NAME: ZaytoonaConnect
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 2.0.0
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
