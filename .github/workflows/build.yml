name: Build ZaytoonaConnect IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build ZaytoonaConnect
        run: |
          set -o pipefail
          xcodebuild \
            -project ZaytoonaConnect.xcodeproj \
            -scheme ZaytoonaConnect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Create unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ZaytoonaConnect.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App bundle not found at $APP_PATH"
            exit 1
          fi

          rm -rf Payload ZaytoonaConnect.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ZaytoonaConnect.app
          /usr/bin/zip -qry ZaytoonaConnect.ipa Payload

          echo "IPA created:"
          ls -lh ZaytoonaConnect.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaytoonaConnect-IPA
          path: ZaytoonaConnect.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
