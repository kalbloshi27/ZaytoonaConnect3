name: Build Zaytoona Connect v2 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app without signing
        run: |
          xcodebuild \
            -project ZaytoonaConnect.xcodeproj \
            -scheme ZaytoonaConnect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Verify app
        run: |
          APP="build/Build/Products/Release-iphoneos/ZaytoonaConnect.app"
          test -d "$APP"
          test -f "$APP/ZaytoonaConnect"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload ZaytoonaConnect-v2-unsigned.ipa
          mkdir Payload
          ditto "build/Build/Products/Release-iphoneos/ZaytoonaConnect.app" "Payload/ZaytoonaConnect.app"
          ditto -c -k --sequesterRsrc --keepParent Payload ZaytoonaConnect-v2-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZaytoonaConnect-v2-unsigned-ipa
          path: ZaytoonaConnect-v2-unsigned.ipa
